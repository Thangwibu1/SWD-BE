id: A03
family: MODULAR_MONOLITH
composeTemplate: infra/sut-templates/monolith-proxy.compose.yaml
cache:
  enabled: true
  targets: [product, cart]
messaging:
  enabled: false
  broker: NONE
scalingProfile: DUAL_APP_PROXY
communication: IN_PROCESS
resourceProfile: monolith_proxy_v1
allowedRoles:
  - api-gateway
  - sut-monolith
  - postgres
  - redis
resources:
  api-gateway:
    cpus: 0.2
    memoryMiB: 256
  sut-monolith:
    cpus: 0.5
    memoryMiB: 896
  sut-monolith-2:
    cpus: 0.5
    memoryMiB: 896
  postgres:
    cpus: 0.5
    memoryMiB: 1280
  redis:
    cpus: 0.3
    memoryMiB: 768
