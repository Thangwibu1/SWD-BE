id: A14
family: MODULAR_MONOLITH
composeTemplate: infra/sut-templates/pg-queue-a14.compose.yaml
cache:
  enabled: false
  targets: []
messaging:
  enabled: true
  broker: POSTGRES
scalingProfile: QUEUE_DUAL_API
communication: POSTGRES_QUEUE
resourceProfile: pg_queue_a14_v1
allowedRoles:
  - api-gateway
  - sut-monolith
  - sut-monolith-2
  - postgres
  - pg-queue-worker
resources:
