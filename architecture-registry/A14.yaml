    cpus: 0.1
    memoryMiB: 192
  postgres:
    cpus: 0.8
    memoryMiB: 1536
  sut-monolith:
    cpus: 0.3
    memoryMiB: 640
  pg-queue-worker:
    cpus: 0.3
    memoryMiB: 384
  sut-monolith-2:
    cpus: 0.3
    memoryMiB: 640
