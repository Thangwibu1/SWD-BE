id: A31
family: REST_MICROSERVICES
composeTemplate: infra/sut-templates/matrix-a31.compose.yaml
cache:
  enabled: true
  targets:
    - product
messaging:
  enabled: false
  broker: NONE
scalingProfile: ORDER_SCALED
communication: HTTP_JSON
resourceProfile: matrix_a31_v1
allowedRoles:
  - api-gateway
  - user-service
  - catalog-service
  - inventory-service
  - order-service
  - payment-mock
  - notification-mock
  - postgres
  - redis
resources:
  api-gateway:
    cpus: 0.2
    memoryMiB: 256
  user-service:
    cpus: 0.1
    memoryMiB: 128
  catalog-service:
    cpus: 0.2
    memoryMiB: 256
  inventory-service:
    cpus: 0.2
    memoryMiB: 320
  order-service:
    cpus: 0.2
    memoryMiB: 320
  order-service-2:
    cpus: 0.2
    memoryMiB: 320
  payment-mock:
    cpus: 0.1
    memoryMiB: 128
  notification-mock:
    cpus: 0.1
    memoryMiB: 128
  postgres:
    cpus: 0.5
    memoryMiB: 1536
  redis:
    cpus: 0.2
    memoryMiB: 704
