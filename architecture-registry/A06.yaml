id: A06
family: REST_MICROSERVICES
composeTemplate: infra/sut-templates/rest-cached.compose.yaml
cache:
  enabled: true
  targets: [product, cart]
messaging:
  enabled: false
  broker: NONE
scalingProfile: ONE_PER_SERVICE
communication: HTTP_JSON
resourceProfile: rest_cached_v1
allowedRoles:
  - api-gateway
  - user-service
  - catalog-service
  - inventory-service
  - order-service
  - payment-mock
  - notification-mock
  - postgres
  - redis
resources:
  api-gateway:
    cpus: 0.2
    memoryMiB: 256
  user-service:
    cpus: 0.1
    memoryMiB: 256
  catalog-service:
    cpus: 0.2
    memoryMiB: 384
  inventory-service:
    cpus: 0.2
    memoryMiB: 384
  order-service:
    cpus: 0.3
    memoryMiB: 512
  payment-mock:
    cpus: 0.1
    memoryMiB: 128
  notification-mock:
    cpus: 0.1
    memoryMiB: 128
  postgres:
    cpus: 0.6
    memoryMiB: 1536
  redis:
    cpus: 0.2
    memoryMiB: 512
