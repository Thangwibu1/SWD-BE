    cpus: 0.2
    memoryMiB: 256
  user-service:
    cpus: 0.1
    memoryMiB: 128
  catalog-service:
    cpus: 0.15
    memoryMiB: 256
  catalog-service-2:
    cpus: 0.15
    memoryMiB: 256
  inventory-service:
    cpus: 0.2
    memoryMiB: 320
  order-service:
    cpus: 0.3
    memoryMiB: 384
  payment-mock:
    cpus: 0.1
    memoryMiB: 128
  notification-mock:
    cpus: 0.1
    memoryMiB: 128
  postgres:
    cpus: 0.5
    memoryMiB: 1536
