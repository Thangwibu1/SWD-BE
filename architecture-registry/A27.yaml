id: A27
family: REST_MICROSERVICES
composeTemplate: infra/sut-templates/matrix-a27.compose.yaml
cache:
  enabled: false
  targets: []
messaging:
  enabled: false
  broker: NONE
scalingProfile: CATALOG_SCALED
communication: HTTP_JSON
resourceProfile: matrix_a27_v1
allowedRoles:
  - api-gateway
  - user-service
  - catalog-service
  - inventory-service
  - order-service
  - payment-mock
  - notification-mock
  - postgres
resources:
