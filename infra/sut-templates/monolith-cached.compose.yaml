# A02 — Monolith with Redis cache: one app, one PostgreSQL, one Redis.
# Redis caches product reads and stores cart data.
services:
  app:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: sut-monolith
      ARCHITECTURE_ID: A02
      DATABASE_URL: postgres://bench:bench@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    cpus: "1.0"
    mem_limit: 1792m
    restart: "no"

  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 12
    cpus: "0.5"
    mem_limit: 1536m

  redis:
    image: redis:${REDIS_VERSION}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 12
    cpus: "0.5"
    mem_limit: 768m
