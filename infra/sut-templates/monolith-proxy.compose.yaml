# A03 — Monolith with Redis cache and API Gateway proxy (2 app instances)
services:
  api-gateway:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: api-gateway
      ARCHITECTURE_ID: A03
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
      # Downstream targets
      MONOLITH_URL: http://sut-monolith:3000,http://sut-monolith-2:3000
    depends_on:
      sut-monolith:
        condition: service_healthy
      sut-monolith-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    cpus: "0.2"
    mem_limit: 256m
    restart: "no"

  sut-monolith:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: sut-monolith
      ARCHITECTURE_ID: A03
      DATABASE_URL: postgres://bench:bench@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    cpus: "0.5"
    mem_limit: 896m
    restart: "no"

  sut-monolith-2:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: sut-monolith
      ARCHITECTURE_ID: A03
      DATABASE_URL: postgres://bench:bench@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    cpus: "0.5"
    mem_limit: 896m
    restart: "no"

  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 12
    cpus: "0.5"
    mem_limit: 1280m

  redis:
    image: redis:${REDIS_VERSION}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 12
    cpus: "0.3"
    mem_limit: 768m
