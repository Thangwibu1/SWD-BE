# A06 — REST Microservices with Redis Cache
services:
  app:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: api-gateway
      ARCHITECTURE_ID: A06
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
      USER_URL: http://user-service:3000
      CATALOG_URL: http://catalog-service:3000
      ORDER_URL: http://order-service:3000
      PAYMENT_URL: http://payment-mock:3000
    depends_on:
      user-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      payment-mock: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    cpus: "0.2"
    mem_limit: 256m
    restart: "no"

  user-service:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: user-service
      ARCHITECTURE_ID: A06
      DATABASE_URL: postgres://bench:bench@postgres:5432/ecommerce
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
    cpus: "0.1"
    mem_limit: 256m

  catalog-service:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: catalog-service
      ARCHITECTURE_ID: A06
      DATABASE_URL: postgres://bench:bench@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
    cpus: "0.2"
    mem_limit: 384m

  inventory-service:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: inventory-service
      ARCHITECTURE_ID: A06
      DATABASE_URL: postgres://bench:bench@postgres:5432/ecommerce
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
    cpus: "0.2"
    mem_limit: 384m

  order-service:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: order-service
      ARCHITECTURE_ID: A06
      DATABASE_URL: postgres://bench:bench@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379
      INVENTORY_URL: http://inventory-service:3000
      PAYMENT_URL: http://payment-mock:3000
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
    cpus: "0.3"
    mem_limit: 512m

  payment-mock:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: payment-mock
      ARCHITECTURE_ID: A06
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
    cpus: "0.1"
    mem_limit: 128m

  notification-mock:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: notification-mock
      ARCHITECTURE_ID: A06
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
    cpus: "0.1"
    mem_limit: 128m

  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 12
    cpus: "0.6"
    mem_limit: 1536m

  redis:
    image: redis:${REDIS_VERSION}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 12
    cpus: "0.2"
    mem_limit: 512m
