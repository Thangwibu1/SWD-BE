services:
  app:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: api-gateway
      ARCHITECTURE_ID: A16
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
      MONOLITH_URL: http://sut-monolith:3000,http://sut-monolith-2:3000
    depends_on:
      sut-monolith:
        condition: service_healthy
      sut-monolith-2:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - dist/healthcheck.js
        - http://localhost:3000/ready
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    cpus: "0.1"
    mem_limit: 192m
    restart: no
  sut-monolith:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: sut-monolith
      ARCHITECTURE_ID: A16
      DATABASE_URL: postgres://bench:bench@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - dist/healthcheck.js
        - http://localhost:3000/ready
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    cpus: "0.3"
    mem_limit: 640m
    restart: no
  sut-monolith-2:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: sut-monolith
      ARCHITECTURE_ID: A16
      DATABASE_URL: postgres://bench:bench@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - dist/healthcheck.js
        - http://localhost:3000/ready
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    cpus: "0.3"
    mem_limit: 640m
    restart: no
  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: ecommerce
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U bench -d ecommerce
      interval: 5s
      timeout: 3s
      retries: 12
    cpus: "0.8"
    mem_limit: 1536m
  redis:
    image: redis:${REDIS_VERSION}
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 2s
      retries: 12
    cpus: "0.1"
    mem_limit: 128m
  pg-queue-worker:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: pg-queue-worker
      ARCHITECTURE_ID: A16
      DATABASE_URL: postgres://bench:bench@postgres:5432/ecommerce
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - dist/healthcheck.js
        - http://localhost:3000/ready
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    cpus: "0.2"
    mem_limit: 384m
    restart: no
  pg-queue-worker-2:
    image: ${BACKEND_IMAGE_DIGEST}
    environment:
      APP_ROLE: pg-queue-worker
      ARCHITECTURE_ID: A16
      DATABASE_URL: postgres://bench:bench@postgres:5432/ecommerce
      SUT_PORT: "3000"
      LOG_LEVEL: warn
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - dist/healthcheck.js
        - http://localhost:3000/ready
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    cpus: "0.2"
    mem_limit: 384m
    restart: no
