global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'sut-services'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/sut-targets.json']
        refresh_interval: 2s
    metrics_path: /metrics
    scrape_timeout: 2s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics
    scrape_timeout: 2s
