services:
  worker:
    environment:
      LOAD_RUNNER_MODE: ssh
      LOAD_HOST_SSH: ${LOAD_HOST_SSH:?set LOAD_HOST_SSH}
      LOAD_HOST_WORKDIR: ${LOAD_HOST_WORKDIR:-/opt/architecture-benchmark}
      LOAD_HOST_SSH_KEY: /run/secrets/load-host-ed25519
      LOAD_HOST_SUT_HOST: ${LOAD_HOST_SUT_HOST:?set LOAD_HOST_SUT_HOST}
      K6_TIMESERIES_MODE: ${K6_TIMESERIES_MODE:-auto}
      K6_FULL_TIMESERIES_MAX_RPS: ${K6_FULL_TIMESERIES_MAX_RPS:-500}
      K6_EXPECTED_ITERATION_SECONDS: ${K6_EXPECTED_ITERATION_SECONDS:-0.30}
      K6_VU_HEADROOM: ${K6_VU_HEADROOM:-1.5}
      K6_MAX_VUS_MULTIPLIER: ${K6_MAX_VUS_MULTIPLIER:-2}
      K6_MAX_VUS_CAP: ${K6_MAX_VUS_CAP:-20000}
      K6_E2E_POLL_SAMPLE_RATE: ${K6_E2E_POLL_SAMPLE_RATE:-0.01}
    volumes:
      - ${LOAD_HOST_SSH_KEY_PATH:?set LOAD_HOST_SSH_KEY_PATH}:/run/secrets/load-host-ed25519:ro
      - ${LOAD_HOST_KNOWN_HOSTS_PATH:?set LOAD_HOST_KNOWN_HOSTS_PATH}:/root/.ssh/known_hosts:ro
