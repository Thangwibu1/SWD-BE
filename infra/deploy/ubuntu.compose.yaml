# Host operations remain explicit; this override does not alter sysctl globally.
x-runtime: &runtime
  init: true
  stop_grace_period: 60s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  ulimits:
    nofile: { soft: 65535, hard: 65535 }
services:
  backend:
    <<: *runtime
  worker:
    <<: *runtime
  frontend:
    <<: *runtime
  prometheus:
    <<: *runtime
  cadvisor:
    <<: *runtime
